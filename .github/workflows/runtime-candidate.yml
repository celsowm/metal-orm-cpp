name: runtime-candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-candidate.yml

jobs:
  query-runtime:
    runs-on: ubuntu-latest
    container: gcc:16
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build libsqlite3-dev

      - name: Apply current GCC 16 candidate fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ci.yml').read_text()
          marker = "          from pathlib import Path\n"
          start = text.index(marker)
          end = text.index("          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, '<candidate-fixes>', 'exec'))
          PY

      - name: Apply deterministic query candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'candidate regex did not match exactly once: {path}: {pattern[:80]!r}, count={count}')
              p.write_text(updated)

          compiler = 'include/metal/query/sqlite_compiler.hpp'

          sub(compiler,
              r'    for \(const auto& branch : value\.branches\) \{\n\s*out \+= " WHEN " \+ compile_expression\(branch\.when, ctx\) \+\n\s*" THEN " \+ compile_scalar\(branch\.then_value, ctx\);\n\s*\}',
              '''    for (const auto& branch : value.branches) {
                  const auto when_sql = compile_expression(branch.when, ctx);
                  const auto then_sql = compile_scalar(branch.then_value, ctx);
                  out += " WHEN " + when_sql + " THEN " + then_sql;
              }''')

          sub(compiler,
              r'inline std::string compile_arithmetic\(const ArithmeticRef& value, CompileContext& ctx\) \{\n\s*return "\\\(" \+ compile_scalar\(value\.left, ctx\) \+ " " \+ arithmetic_token\(value\.op\) \+ " " \+\n\s*compile_scalar\(value\.right, ctx\) \+ "\\\)";\n\}',
              '''inline std::string compile_arithmetic(const ArithmeticRef& value, CompileContext& ctx) {
                  const auto left = compile_scalar(value.left, ctx);
                  const auto right = compile_scalar(value.right, ctx);
                  return "(" + left + " " + arithmetic_token(value.op) + " " + right + ")";
              }''')

          sub(compiler,
              r'if constexpr \(std::same_as<N, ComparisonNode>\) \{\n\s*return compile_scalar\(node\.left, ctx\) \+ " " \+ compare_token\(node\.op\) \+ " " \+\n\s*compile_scalar\(node\.right, ctx\);\n\s*\} else if constexpr \(std::same_as<N, NullCheckNode>\)',
              '''if constexpr (std::same_as<N, ComparisonNode>) {
                      const auto left = compile_scalar(node.left, ctx);
                      const auto right = compile_scalar(node.right, ctx);
                      return left + " " + compare_token(node.op) + " " + right;
                  } else if constexpr (std::same_as<N, NullCheckNode>)''')

          sub(compiler,
              r'\} else if constexpr \(std::same_as<N, LikeNode>\) \{\n\s*return compile_scalar\(node\.operand, ctx\) \+ \(node\.negated \? " NOT LIKE " : " LIKE "\) \+\n\s*compile_scalar\(node\.pattern, ctx\);\n\s*\} else if constexpr \(std::same_as<N, BetweenNode>\) \{\n\s*return compile_scalar\(node\.operand, ctx\) \+ \(node\.negated \? " NOT BETWEEN " : " BETWEEN "\) \+\n\s*compile_scalar\(node\.lower, ctx\) \+ " AND " \+ compile_scalar\(node\.upper, ctx\);',
              '''} else if constexpr (std::same_as<N, LikeNode>) {
                      const auto operand = compile_scalar(node.operand, ctx);
                      const auto pattern = compile_scalar(node.pattern, ctx);
                      return operand + (node.negated ? " NOT LIKE " : " LIKE ") + pattern;
                  } else if constexpr (std::same_as<N, BetweenNode>) {
                      const auto operand = compile_scalar(node.operand, ctx);
                      const auto lower = compile_scalar(node.lower, ctx);
                      const auto upper = compile_scalar(node.upper, ctx);
                      return operand + (node.negated ? " NOT BETWEEN " : " BETWEEN ") + lower + " AND " + upper;''')

          sub(compiler,
              r'\} else if constexpr \(std::same_as<N, LogicalNode>\) \{\n\s*return "\\\(" \+ compile_expression\(node\.left, ctx\) \+\n\s*\(node\.op == LogicOp::And \? " AND " : " OR "\) \+\n\s*compile_expression\(node\.right, ctx\) \+ "\\\)";\n\s*\} else \{',
              '''} else if constexpr (std::same_as<N, LogicalNode>) {
                      const auto left = compile_expression(node.left, ctx);
                      const auto right = compile_expression(node.right, ctx);
                      return "(" + left + (node.op == LogicOp::And ? " AND " : " OR ") + right + ")";
                  } else {''')

          select = 'include/metal/query/select.hpp'
          sub(select,
              r'        if \(where_sql \|\| extra_where_sql\) \{\n\s*base \+= " WHERE ";\n\s*if \(where_sql\) base \+= "\\\(" \+ \*where_sql \+ "\\\)";\n\s*if \(where_sql && extra_where_sql\) base \+= " AND ";\n\s*if \(extra_where_sql\) base \+= "\\\(" \+ \*extra_where_sql \+ "\\\)";\n\s*\}',
              '''        if (where_sql || extra_where_sql) {
                      base += " WHERE ";
                      if (where_sql && extra_where_sql) {
                          base += "(" + *where_sql + ") AND (" + *extra_where_sql + ")";
                      } else if (where_sql) {
                          base += *where_sql;
                      } else {
                          base += *extra_where_sql;
                      }
                  }''')
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DMETAL_ORM_BUILD_EXAMPLES=OFF -DMETAL_ORM_BUILD_TESTS=ON

      - name: Build query-related tests
        run: |
          cmake --build build --target \
            metal-orm-tests \
            metal-orm-query-tests \
            metal-orm-advanced-query-parity-tests \
            metal-orm-computed-query-parity-tests \
            metal-orm-blob-parity-tests \
            metal-orm-dto-filter-parity-tests

      - name: Run query-related tests
        run: |
          ctest --test-dir build --output-on-failure -R '^(metal-orm-tests|metal-orm-query-tests|metal-orm-advanced-query-parity-tests|metal-orm-computed-query-parity-tests|metal-orm-blob-parity-tests|metal-orm-dto-filter-parity-tests)$'
