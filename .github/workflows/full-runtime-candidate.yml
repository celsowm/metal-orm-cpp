name: full-runtime-candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-runtime-candidate.yml
      - tests/test_bulk_parity.cpp

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    container: gcc:16

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build libsqlite3-dev git

      - name: Apply current GCC 16 candidate fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('.github/workflows/ci.yml').read_text()
          marker = "          from pathlib import Path\n"
          start = text.index(marker)
          end = text.index("          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, '<candidate-fixes>', 'exec'), {'Path': Path, 're': re})
          PY

      - name: Apply deterministic query candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('.github/workflows/runtime-candidate.yml').read_text()
          text = text.split('- name: Apply deterministic query candidate', 1)[1]
          marker = "          from pathlib import Path\n"
          start = text.index(marker)
          end = text.index("          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, '<deterministic-query>', 'exec'), {'Path': Path, 're': re})
          PY

      - name: Apply pool lifecycle and arithmetic expectation fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'candidate patch context not found: {path}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'include/metal/pool.hpp',
              '''        state->reaper.request_stop();
                  state->cv.notify_all();
                  state->reaper_cv.notify_all();

                  std::exception_ptr first_error;''',
              '''        state->reaper.request_stop();
                  state->cv.notify_all();
                  state->reaper_cv.notify_all();
                  if (state->reaper.joinable()) state->reaper.join();

                  std::exception_ptr first_error;''')

          replace(
              'tests/test_computed_query_parity.cpp',
              '    assert(arithmetic_sql.params.size() == 6);',
              '    assert(arithmetic_sql.params.size() == 7);')
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DMETAL_ORM_BUILD_EXAMPLES=ON -DMETAL_ORM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Promote verified fixes
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/metal/reflection.hpp \
                  include/metal/query/expressions.hpp \
                  include/metal/query/select.hpp \
                  include/metal/query/pagination.hpp \
                  include/metal/query/sqlite_compiler.hpp \
                  include/metal/view.hpp \
                  include/metal/openapi_components.hpp \
                  include/metal/orm.hpp \
                  include/metal/mapping.hpp \
                  include/metal/dml.hpp \
                  include/metal/relation_change_processor.hpp \
                  include/metal/pool.hpp \
                  tests/test_computed_query_parity.cpp
          if ! git diff --cached --quiet; then
            git commit -m "fix: stabilize GCC 16 runtime parity"
            git push origin HEAD:main
          fi
