name: runtime-residual-diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-residual-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container: gcc:16
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build libsqlite3-dev

      - name: Apply current candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def execute_embedded(path, section_name):
              text = Path(path).read_text()
              if section_name:
                  text = text.split(f'- name: {section_name}', 1)[1]
              marker = '          from pathlib import Path\n'
              start = text.index(marker)
              end = text.index('          PY\n', start)
              lines = text[start:end].splitlines()
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
              exec(compile(script, f'<{section_name or path}>', 'exec'))

          execute_embedded('.github/workflows/ci.yml', None)
          execute_embedded('.github/workflows/runtime-candidate.yml', 'Apply deterministic query candidate')
          PY

      - name: Inject residual diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'diagnostic context missing: {path}')
              p.write_text(text.replace(old, new, 1))

          for path in ('tests/test_main.cpp', 'tests/test_computed_query_parity.cpp', 'tests/test_blob_parity.cpp'):
              p = Path(path)
              text = p.read_text()
              if '#include <iostream>' not in text:
                  text = text.replace('#include <cassert>\n', '#include <cassert>\n#include <iostream>\n', 1)
              p.write_text(text)

          replace(
              'tests/test_main.cpp',
              '    assert(users.size() == 2);\n',
              '''    const auto raw_posts = db->execute("SELECT id, user_id, title FROM posts ORDER BY id;");
              std::cerr << "DIAG_POST_ROWS=" << raw_posts.rows.size() << "\\n";
              for (const auto& row : raw_posts.rows) {
                  std::cerr << "DIAG_POST="
                            << metal::value_key(row.at("id")) << ","
                            << metal::value_key(row.at("user_id")) << ","
                            << metal::value_key(row.at("title")) << "\\n";
              }
              std::cerr << "DIAG_USERS=" << users.size();
              for (const auto& user : users) {
                  std::cerr << " id=" << user->id << ":posts=" << user->posts.size();
              }
              std::cerr << "\\n";
              assert(users.size() == 2);
              ''')

          replace(
              'tests/test_computed_query_parity.cpp',
              '    assert(arithmetic_sql.params.size() == 6);\n',
              '''    std::cerr << "DIAG_ARITH_SQL=" << arithmetic_sql.sql << "\\n";
              std::cerr << "DIAG_ARITH_PARAMS=" << arithmetic_sql.params.size() << ":";
              for (const auto& value : arithmetic_sql.params) std::cerr << metal::value_key(value) << "|";
              std::cerr << "\\n";
              assert(arithmetic_sql.params.size() == 6);
              ''')

          replace(
              'tests/test_blob_parity.cpp',
              '    assert(metal::from_value<std::string>(raw_types.rows[0].at("optional_type")) == "blob");\n',
              '''    std::cerr << "DIAG_BLOB0="
                        << metal::from_value<std::string>(raw_types.rows[0].at("payload_type")) << ","
                        << metal::from_value<std::string>(raw_types.rows[0].at("optional_type")) << ","
                        << metal::value_key(raw_types.rows[0].at("optional_length")) << "\\n";
              std::cerr << "DIAG_BLOB1="
                        << metal::from_value<std::string>(raw_types.rows[1].at("payload_type")) << ","
                        << metal::from_value<std::string>(raw_types.rows[1].at("optional_type")) << ","
                        << metal::value_key(raw_types.rows[1].at("payload_length")) << "\\n";
              assert(metal::from_value<std::string>(raw_types.rows[0].at("optional_type")) == "blob");
              ''')
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DMETAL_ORM_BUILD_EXAMPLES=OFF -DMETAL_ORM_BUILD_TESTS=ON

      - name: Build residual tests
        run: |
          cmake --build build --target \
            metal-orm-tests \
            metal-orm-computed-query-parity-tests \
            metal-orm-blob-parity-tests

      - name: Run residual tests
        run: ctest --test-dir build --output-on-failure -R '^(metal-orm-tests|metal-orm-computed-query-parity-tests|metal-orm-blob-parity-tests)$'
