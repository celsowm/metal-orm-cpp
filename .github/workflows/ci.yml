name: ci

on:
  push:
  pull_request:

jobs:
  gcc16-reflection:
    runs-on: ubuntu-latest
    container: gcc:16

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DMETAL_ORM_BUILD_EXAMPLES=ON -DMETAL_ORM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
