name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  gcc16-reflection:
    runs-on: ubuntu-latest
    container: gcc:16

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build libsqlite3-dev git

      - name: Apply candidate GCC 16 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"candidate patch context not found: {path}")
              file.write_text(text.replace(old, new, 1))

          def regex_replace(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"candidate regex patch context not found: {path}")
              file.write_text(updated)

          replace(
              "include/metal/reflection.hpp",
              '''template <info Member>
          consteval std::string_view column_name_view() {
              static_assert(std::meta::is_nonstatic_data_member(Member));
              if constexpr (has<mapping::column>(Member)) {
                  constexpr auto mapped = annotation<mapping::column>(Member);
                  return mapped.name.view();
              } else {
                  return std::meta::identifier_of(Member);
              }
          }''',
              '''template <info Member>
          inline constexpr auto column_mapping = annotation<mapping::column>(Member);

          template <info Member>
          consteval std::string_view column_name_view() {
              static_assert(std::meta::is_nonstatic_data_member(Member));
              if constexpr (has<mapping::column>(Member)) {
                  return column_mapping<Member>.name.view();
              } else {
                  return std::meta::identifier_of(Member);
              }
          }''')

          replace(
              "include/metal/query/expressions.hpp",
              '''template <std::meta::info Member>
          ColumnRef column_ref(Field<Member> = {}) {
              using Owner = typename Field<Member>::owner_type;
              return ColumnRef{std::type_index(typeid(Owner)), reflect::column_name<Member>()};
          }''',
              '''template <std::meta::info Member>
          ColumnRef column_ref(Field<Member> = {}) {
              using Owner = typename Field<Member>::owner_type;
              constexpr auto column = reflect::column_name_view<Member>();
              return ColumnRef{std::type_index(typeid(Owner)), std::string(column)};
          }''')

          replace(
              "include/metal/query/select.hpp",
              '''        state_->cte_joins.push_back(CteJoinSpec{
                      kind, std::move(cte_name), column_ref(field<OwnerMember>), std::move(cte_column)});''',
              '''        using Owner = typename Field<OwnerMember>::owner_type;
                  constexpr auto owner_column = reflect::column_name_view<OwnerMember>();
                  state_->cte_joins.push_back(CteJoinSpec{
                      kind,
                      std::move(cte_name),
                      ColumnRef{std::type_index(typeid(Owner)), std::string(owner_column)},
                      std::move(cte_column)});''')

          replace(
              "include/metal/query/pagination.hpp",
              '''template <std::meta::info Member>
          CursorOrderTerm cursor_order(Field<Member> = {}, bool ascending = true) {
              using Owner = typename Field<Member>::owner_type;
              return CursorOrderTerm{
                  std::type_index(typeid(Owner)),
                  reflect::table_name<Owner>(),
                  reflect::column_name<Member>(),
                  ascending};
          }''',
              '''template <std::meta::info Member>
          CursorOrderTerm cursor_order(Field<Member> = {}, bool ascending = true) {
              using Owner = typename Field<Member>::owner_type;
              constexpr auto column = reflect::column_name_view<Member>();
              return CursorOrderTerm{
                  std::type_index(typeid(Owner)),
                  reflect::table_name<Owner>(),
                  std::string(column),
                  ascending};
          }''')

          replace(
              "include/metal/query/pagination.hpp",
              '''        } else if constexpr (std::same_as<V, std::string>) {
                      tag = 's';
                      return v;
                  } else {
                      tag = 'b';
                      return v ? "1" : "0";
                  }''',
              '''        } else if constexpr (std::same_as<V, std::string>) {
                      tag = 's';
                      return v;
                  } else if constexpr (std::same_as<V, bool>) {
                      tag = 'b';
                      return v ? "1" : "0";
                  } else {
                      tag = 'x';
                      std::string out;
                      out.reserve(v.size());
                      for (const auto byte : v) {
                          out.push_back(static_cast<char>(static_cast<unsigned char>(byte)));
                      }
                      return out;
                  }''')

          replace(
              "include/metal/query/pagination.hpp",
              '''        case 'b':
                      if (text == "1") return Value{true};
                      if (text == "0") return Value{false};
                      break;
              }''',
              '''        case 'b':
                      if (text == "1") return Value{true};
                      if (text == "0") return Value{false};
                      break;
                  case 'x': {
                      Blob blob;
                      blob.reserve(text.size());
                      for (const unsigned char byte : text) {
                          blob.push_back(static_cast<std::byte>(byte));
                      }
                      return Value{std::move(blob)};
                  }
              }''')

          replace(
              "include/metal/view.hpp",
              '''    template <std::meta::info Member>
              requires std::same_as<reflect::owner_type_t<Member>, T> && reflect::is_view_column<Member>()
              ViewQuery& order_by(bool ascending = true) {
                  order_by_.push_back(ViewOrderSpec{reflect::column_name<Member>(), ascending});
                  return *this;
              }''',
              '''    template <std::meta::info Member>
              requires (std::same_as<reflect::owner_type_t<Member>, T> && reflect::is_view_column<Member>())
              ViewQuery& order_by(bool ascending = true) {
                  constexpr auto column = reflect::column_name_view<Member>();
                  order_by_.push_back(ViewOrderSpec{std::string(column), ascending});
                  return *this;
              }''')

          replace(
              "include/metal/openapi_components.hpp",
              '''        } else if constexpr (std::same_as<V, double>) {
                      std::ostringstream out;
                      out << "d:" << std::setprecision(17) << item;
                      return out.str();
                  } else {
                      return "s:" + std::to_string(item.size()) + ":" + item;
                  }''',
              '''        } else if constexpr (std::same_as<V, double>) {
                      std::ostringstream out;
                      out << "d:" << std::setprecision(17) << item;
                      return out.str();
                  } else if constexpr (std::same_as<V, Blob>) {
                      static constexpr char hex[] = "0123456789abcdef";
                      std::string out = "b:" + std::to_string(item.size()) + ":";
                      out.reserve(out.size() + item.size() * 2);
                      for (const auto byte : item) {
                          const auto value = static_cast<unsigned int>(byte);
                          out.push_back(hex[(value >> 4) & 0x0f]);
                          out.push_back(hex[value & 0x0f]);
                      }
                      return out;
                  } else {
                      return "s:" + std::to_string(item.size()) + ":" + item;
                  }''')

          regex_replace(
              "include/metal/orm.hpp",
              r'(?P<indent>[ \t]+)constexpr auto target_key = reflect::key_or_primary<Target>\(Traits::target_key\(\)\);\n(?P=indent)using ForeignKey = reflect::member_type_t<foreign_key>;',
              r'''\g<indent>constexpr auto target_key = reflect::key_or_primary<Target>(Traits::target_key());
          \g<indent>constexpr bool target_key_is_pk = target_key == reflect::primary_key_member<Target>();
          \g<indent>constexpr bool target_key_is_generated =
          \g<indent>    target_key_is_pk && reflect::primary_key_is_generated<Target>();
          \g<indent>using ForeignKey = reflect::member_type_t<foreign_key>;''')

          regex_replace(
              "include/metal/orm.hpp",
              r'(?P<indent>[ \t]+)if \(!std::holds_alternative<std::nullptr_t>\(key\) &&\n[ \t]+!\(target_key == reflect::primary_key_member<Target>\(\) &&\n[ \t]+reflect::primary_key_is_generated<Target>\(\) &&\n[ \t]+is_empty_generated_value\(key\)\)\) \{\n[ \t]+\(\*locked\)\.\[:foreign_key:\] = from_value<ForeignKey>\(key\);\n[ \t]+\}',
              r'''\g<indent>if (!std::holds_alternative<std::nullptr_t>(key)) {
          \g<indent>    if constexpr (target_key_is_generated) {
          \g<indent>        if (is_empty_generated_value(key)) return;
          \g<indent>    }
          \g<indent>    (*locked).[:foreign_key:] = from_value<ForeignKey>(key);
          \g<indent>}''')
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DMETAL_ORM_BUILD_EXAMPLES=ON -DMETAL_ORM_BUILD_TESTS=ON

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc16-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit verified GCC 16 fixes
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/metal/reflection.hpp \
                  include/metal/query/expressions.hpp \
                  include/metal/query/select.hpp \
                  include/metal/query/pagination.hpp \
                  include/metal/view.hpp \
                  include/metal/openapi_components.hpp \
                  include/metal/orm.hpp
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore GCC 16 reflection build"
            git push origin HEAD:main
          fi
