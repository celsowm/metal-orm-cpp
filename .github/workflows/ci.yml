name: ci

on:
  push:
  pull_request:

jobs:
  gcc16-reflection:
    runs-on: ubuntu-latest
    container: gcc:16

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DMETAL_ORM_BUILD_EXAMPLES=ON -DMETAL_ORM_BUILD_TESTS=ON

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc16-build-log
          path: build.log
          if-no-files-found: error

      - name: Test
        run: ctest --test-dir build --output-on-failure
